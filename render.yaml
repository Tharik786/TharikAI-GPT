services:
  - type: web
    name: tharik-ai-gpt-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: SERVE_FRONTEND
        value: "false"
      - key: AUTO_RUN_FRONTEND
        value: "false"
      - key: CORS_ORIGINS
        value: "https://tharikai.netlify.app"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "openrouter/auto"
      - key: OPENROUTER_MAX_TOKENS
        value: "40000000000000096"
